<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conquest Field Photos</title>
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Conquest Photos">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1 class="text-center my-4">Conquest Field Photos</h1>
    
    <!-- Offline indicator -->
    <div id="offline-indicator" class="alert alert-warning" style="display: none;">
      You are currently offline. The app will still work, but you won't be able to access new updates.
    </div>
    
    <!-- Photo Names Input Section -->
    <div id="photo-names-section">
      <h2>Enter Photo Names</h2>
      <form id="photo-names-form">
        <div class="mb-3">
          <textarea
            id="photo-names"
            class="form-control"
            placeholder="Enter photo names, one per line"
            rows="10"
            required
          ></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100">Next</button>
      </form>
    </div>
    
    <!-- Photo Upload Section -->
    <div id="photo-upload-section" style="display: none;">
      <h2>Upload Photos</h2>
      <div class="mb-3">
        <button id="back-button" class="btn btn-secondary">Back to Names</button>
      </div>
      <form id="photo-upload-form" class="mb-3"></form>
      <button id="process-button" class="btn btn-success w-100">
        Process
      </button>
    </div>
    
    <!-- Footer with install prompt -->
    <div class="mt-4 text-center">
      <div id="install-container" style="display: none;">
        <p>Install this app on your device:</p>
        <button id="install-button" class="btn btn-outline-primary">Add to Home Screen</button>
      </div>
    </div>
  </div>
  
  <!-- Include JSZip and FileSaver.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <!-- Include Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
  <!-- Include your JavaScript file -->
  <script src="app.js"></script>
</body>
</html>
